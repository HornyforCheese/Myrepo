name: Publish Mutiny Media Linux DEB to GitHub Releases

on:
  push:
    branches:
      - mutiny-media-publish-deb-20261117

permissions:
  actions: read
  contents: write

jobs:
  publish-deb:
    if: github.repository == 'HornyforCheese/Myrepo'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: HornyforCheese/Myrepo
      SOURCE_RUN: "44076812786"
      SOURCE_COMMIT: abed045ae447e97229b97fcb205ea45feb375e23
      RELEASE_TAG: linux-v1.0.1-ui-fix-20261117
    steps:
      - name: Confirm source workflow and uploaded DEB
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" --jq '.head_sha')"
          test "$actual" = "$SOURCE_COMMIT"
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/artifacts" --jq '.artifacts[] | select(.name == "mutiny-media-1.0.1-linux-x64-deb" and .expired == false) | [.id, .size_in_bytes] | @tsv'
          test "$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/artifacts" --jq '[.artifacts[] | select(.name == "mutiny-media-1.0.1-linux-x64-deb" and .expired == false)] | length')" = "1"

      - name: Download and inspect DEB from exact GitHub Actions run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming release
          gh run download "$SOURCE_RUN" --repo "$GH_REPO" --name mutiny-media-1.0.1-linux-x64-deb --dir incoming
          mapfile -d '' -t debs < <(find incoming -type f -name '*.deb' -print0)
          test "${#debs[@]}" -eq 1
          deb="${debs[0]}"
          test -s "$deb"
          pkg="$(dpkg-deb --field "$deb" Package)"
          ver="$(dpkg-deb --field "$deb" Version)"
          arch="$(dpkg-deb --field "$deb" Architecture)"
          echo "Package=$pkg, Version=$ver, Architecture=$arch"
          test "$ver" = "1.0.1"
          test "$arch" = "amd64"
          [[ "$pkg" == *mutiny* ]] || { echo "Unexpected package: $pkg"; exit 1; }
          cp "$deb" release/MutinyMedia-1.0.1-linux-amd64.deb
          (cd release && sha256sum MutinyMedia-1.0.1-linux-amd64.deb > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Publish versioned release with direct download
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          Native Linux x64 DEB from GitHub Actions run 44076812786, source commit abed045ae447e97229b97fcb205ea45feb375e23.
          
          Includes the Linux sidebar branding and offline-indicator changes committed on 17 November 2026. The DEB build, system-tool collision check and artifact upload succeeded. The separate AppImage build failed, so no AppImage is included here.
          
          This is a testing build. Linux GUI launch, media playback, complete branding and connectivity still need validation on the target Vultr system. 
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/MutinyMedia-1.0.1-linux-amd64.deb release/SHA256SUMS.txt --repo "$GH_REPO" --clobber
          else
            gh release create "$RELEASE_TAG" release/MutinyMedia-1.0.1-linux-amd64.deb release/SHA256SUMS.txt --repo "$GH_REPO" --target "$SOURCE_COMMIT" --title "Mutiny Media 1.0.1 Linux - UI fixes (testing)" --notes-file release-notes.md
          fi
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets --jq '.assets[] | [.name, .url, .size] | @tsv'
