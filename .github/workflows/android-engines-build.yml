name: Build Mutiny Media Android 1.0.1 engines

on:
  push:
    branches:
      - android-v1.0.1-engines-development
    paths:
      - 'android/**'
      - '.github/workflows/android-engines-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify Android and optionally package debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: android/package-lock.json
      - name: Prepare preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$sdkmanager_bin"
          "$sdkmanager_bin" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Run JavaScript unit tests
        run: npm test
      - name: Compile Android sources
        run: bash ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Run native transport fixtures
        run: |
          jar="$RUNNER_TEMP/org-json.jar"
          curl -fsSL https://repo.maven.apache.org/maven2/org/json/json/20250517/json-20250517.jar -o "$jar"
          echo "3ea61b2a06e31edf1c91134fe9106b0ebb16628be169f3db75bc7a2b06b45796  $jar" | sha256sum -c -
          classes="$RUNNER_TEMP/native-fixtures"
          mkdir -p "$classes"
          javac --release 17 -cp "$jar" -d "$classes" app/src/main/java/app/mutiny/media/{Secrets,Accounts,AiClient,CloudStreamRepository,CloudStreamArchive,MagnetUri,UrlPolicy}.java tests/*.java
          for fixture in AccountSessionTest AiClientTest ModelCatalogueTest CloudStreamRepositoryTest app.mutiny.media.CloudStreamArchiveTest app.mutiny.media.MagnetUriTest UrlPolicyTest; do
            java -cp "$jar:$classes" "$fixture"
          done
      - name: Verify mobile UI with fixture providers
        run: |
          npx playwright install chromium
          npm run test:ui
      - name: Compile and package Android application
        if: github.event_name == 'workflow_dispatch'
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK archive and record checksum
        if: github.event_name == 'workflow_dispatch'
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" > /dev/null
          sha256sum "$apk" > app/build/outputs/apk/debug/SHA256SUMS.txt
          ls -lh "$apk"
          unzip -Z1 "$apk" | grep -Eq 'lib/.+[.]so'
      - name: Publish APK and checksum as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MutinyMedia-Android-1.0.1-engines-dev-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
