name: Reconstruct and build Mutiny Media Windows 1.0.1
on:
  push:
    branches:
      - mutiny-media-windows-1.0.1
  workflow_dispatch:
    inputs:
      publish_existing:
        description: Publish a verified existing Windows installer without rebuilding
        type: boolean
        default: false
      release_run:
        description: Successful build run containing the installer
        type: string
        default: '43424519242'
      release_tag:
        description: Existing tag for the exact source commit
        type: string
        default: windows-v1.0.1
      release_commit:
        description: Exact source commit used by the build
        type: string
        default: ab184a73ceebfc063c5d6aedc0fbaff0111907f1
      release_sha256:
        description: Expected installer SHA-256
        type: string
        default: 10bce43800690d18340e55b433b0821b934b8f71d1187acc79821491028c8ada

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  reconstruct-and-build:
    if: ${{ !inputs.publish_existing }}
    runs-on: windows-2022
    timeout-minutes: 110
    steps:
      - name: Checkout isolated Mutiny Media Windows workbench
        uses: actions/checkout@v4

      - name: Checkout exact upstream 1.0.1 baseline
        uses: actions/checkout@v4
        with:
          repository: Harborofficial/Harbor
          ref: d862943d27ca10beca26d0d53e7bf6be66688968 # v1.0.1-beta
          path: windows-src

      - name: Assemble and verify archived user source overlay
        shell: pwsh
        run: |
          $manifest = Get-Content 'third_party/v4-overlay/manifest.json' -Raw | ConvertFrom-Json
          $parts = @(Get-ChildItem 'third_party/v4-overlay/overlay.part*' -File | Sort-Object Name)
          if ($parts.Count -ne $manifest.parts.Count) { throw "Overlay parts missing: $($parts.Count) found, expected $($manifest.parts.Count)" }
          $zip = Join-Path $env:RUNNER_TEMP 'mutiny-v4-overlay.zip'
          $out = [System.IO.File]::Create($zip)
          try {
            foreach ($part in $parts) {
              $bytes = [System.IO.File]::ReadAllBytes($part.FullName)
              $out.Write($bytes,0,$bytes.Length)
            }
          } finally { $out.Dispose() }
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $manifest.source_sha256) { throw "Archived 1.0.1 overlay checksum failed: $actual" }
          Expand-Archive -LiteralPath $zip -DestinationPath 'v4-kit' -Force
          if (!(Test-Path 'v4-kit/MutinyMedia_v4_DirectSource_Update/tools/apply-update.mjs')) { throw 'Archived source-update scripts were not found' }
          "Validated source overlay: $($parts.Count) chunks, $((Get-Item $zip).Length) bytes"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-src/src-tauri -> target
          cache-on-failure: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Apply archived Mutiny Media v4 source updates
        shell: pwsh
        run: |
          node tools/repair-v4-translation.mjs --pre 'v4-kit/MutinyMedia_v4_DirectSource_Update'
          if ($LASTEXITCODE -ne 0) { throw 'Legacy translation patch preflight failed' }
          node 'v4-kit/MutinyMedia_v4_DirectSource_Update/tools/apply-update.mjs' 'windows-src'
          if ($LASTEXITCODE -ne 0) { throw 'v4 source-update integration failed' }
          node tools/repair-v4-translation.mjs --post 'windows-src'
          if ($LASTEXITCODE -ne 0) { throw 'Legacy translation compatibility update failed' }
          node tools/repair-windows-native.mjs 'windows-src'
          if ($LASTEXITCODE -ne 0) { throw 'Native source coherence repair failed' }
          node tools/complete-windows-source.mjs 'windows-src'
          if ($LASTEXITCODE -ne 0) { throw 'Windows 1.0.1 source contract completion failed' }

      - name: Verify customized Windows 1.0.1 version
        shell: pwsh
        run: node tools/check-project.mjs windows-src

      - name: Install frontend dependencies
        working-directory: windows-src
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Test player routing and source compatibility
        shell: pwsh
        run: |
          $env:TYPESCRIPT_LIB = (Resolve-Path 'windows-src/node_modules/typescript').Path
          node tests/run-tests.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Player routing regression tests failed' }
          node --test tests/*-compat.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Source compatibility tests failed' }

      - name: Test main-window navigation boundary
        shell: pwsh
        run: |
          rustc --edition 2021 --test windows-src/src-tauri/src/mutiny_web_policy.rs -o "$env:RUNNER_TEMP/mutiny-web-policy-tests.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Navigation policy tests did not compile' }
          & "$env:RUNNER_TEMP/mutiny-web-policy-tests.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Navigation policy tests failed' }

      - name: Integrate approved player and branding migration
        shell: pwsh
        run: |
          node tools/apply-player-deck.mjs --target windows-src
          if ($LASTEXITCODE -ne 0) { throw 'Player integration failed' }
          node tools/brand-windows-1.0.1.mjs windows-src --apply
          if ($LASTEXITCODE -ne 0) { throw 'Branding update failed' }
          node tools/apply-player-deck.mjs --target windows-src --verify
          if ($LASTEXITCODE -ne 0) { throw 'Player verification failed' }

      - name: Typecheck combined Windows source
        working-directory: windows-src
        shell: pwsh
        run: pnpm run typecheck

      - name: Archive complete customized Windows source
        shell: pwsh
        run: |
          @{ upstream = 'd862943d27ca10beca26d0d53e7bf6be66688968'; customization = '${{ github.sha }}'; version = '1.0.1' } | ConvertTo-Json | Set-Content 'windows-src/BUILD_SOURCE.json'
          tar -czf "$env:RUNNER_TEMP/mutiny-media-windows-1.0.1-source.tar.gz" --exclude=.git --exclude=node_modules --exclude=target --exclude=.mutiny-1.0.1-contract-backup --exclude='*.tsbuildinfo' -C windows-src .
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }

      - name: Upload complete customized source
        uses: actions/upload-artifact@v4
        with:
          name: mutiny-media-windows-1.0.1-complete-source
          path: ${{ runner.temp }}/mutiny-media-windows-1.0.1-source.tar.gz
          if-no-files-found: error

      - name: Stage Windows binaries and runtime dependencies
        working-directory: windows-src
        shell: pwsh
        run: pnpm run setup

      - name: Build Windows 1.0.1 NSIS installer
        working-directory: windows-src
        shell: pwsh
        run: |
          if (Test-Path 'src-tauri/tauri.windows.conf.json') {
            pnpm tauri build --config src-tauri/tauri.windows.conf.json --bundles nsis
          } else {
            pnpm tauri build --bundles nsis
          }

      - name: Upload rebuilt Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: mutiny-media-windows-1.0.1-reconstructed-installer
          path: windows-src/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Preserve source-stage logs on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host 'Reconstruction did not produce a verified installer; inspect the failing step in GitHub Actions.'
          Write-Host 'The 570 live streaming tests remain pending even if this workflow compiles.'

  publish-verified-installer:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_existing }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: HornyforCheese/Myrepo
      RELEASE_RUN: ${{ inputs.release_run }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      RELEASE_SHA256: ${{ inputs.release_sha256 }}
    steps:
      - name: Verify successful source build
        shell: bash
        run: |
          gh api "repos/HornyforCheese/Myrepo/actions/runs/$RELEASE_RUN" > build.json
          python - <<'PYVERIFY'
          import json, os
          r=json.load(open('build.json'))
          assert r['conclusion']=='success'
          assert r['head_sha']==os.environ['RELEASE_COMMIT']
          assert len(os.environ['RELEASE_SHA256'])==64
          assert all(c in '0123456789abcdef' for c in os.environ['RELEASE_SHA256'])
          PYVERIFY
          test "$(gh api "repos/HornyforCheese/Myrepo/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_COMMIT"
      - name: Download verified installer
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: HornyforCheese/Myrepo
          run-id: ${{ inputs.release_run }}
          name: mutiny-media-windows-1.0.1-reconstructed-installer
          path: installer
      - name: Verify executable and publish release
        shell: bash
        run: |
          mv 'installer/Mutiny Media_1.0.1_x64-setup.exe' installer/MutinyMedia-1.0.1-windows-x64-setup.exe
          cd installer
          printf '%s  MutinyMedia-1.0.1-windows-x64-setup.exe\n' "$RELEASE_SHA256" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cat > release-notes.md <<NOTES
          Mutiny Media 1.0.1 for Windows x64. Download and run the setup executable below.

          Windows optimized release compilation, NSIS packaging, TypeScript checking, source-deck tests and 11 compatibility tests passed. This is a testing release: Windows installation, account connections and live playback remain for user testing. The 570 web-provider playback cases are not run.

          Source commit: $RELEASE_COMMIT
          Build and complete customized source: https://github.com/HornyforCheese/Myrepo/actions/runs/$RELEASE_RUN
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" MutinyMedia-1.0.1-windows-x64-setup.exe SHA256SUMS.txt
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --title "Mutiny Media 1.0.1 — Windows x64 ($RELEASE_TAG)" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" MutinyMedia-1.0.1-windows-x64-setup.exe SHA256SUMS.txt --verify-tag --title "Mutiny Media 1.0.1 — Windows x64 ($RELEASE_TAG)" --notes-file release-notes.md --prerelease
          fi
