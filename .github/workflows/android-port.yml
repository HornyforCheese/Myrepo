name: Mutiny Media Android desktop port
on:
  push:
    branches: [mutiny-android-desktop-port]
permissions:
  actions: read
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43453557318
          name: mutiny-media-windows-1.0.1-complete-source
          path: archive
      - run: |
          mkdir app
          tar -xzf archive/*.tar.gz -C app
          python3 tools/android-no-games.py app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: sudo apt-get update -qq && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - working-directory: app
        run: |
          export NDK_HOME="$ANDROID_NDK_HOME"
          pnpm install --frozen-lockfile
          pnpm typecheck
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('src-tauri/Cargo.toml')
          s = p.read_text()
          line = next(l for l in s.splitlines() if l.startswith('unrar_sys ='))
          target = next(l for l in s.splitlines() if l.startswith('[target.') and 'not(any' in l and 'android' in l and l.endswith('.dependencies]'))
          p.write_text(s.replace(line, '', 1).replace(target, target + chr(10) + line, 1))
          PYTHON
          pnpm tauri android init --ci
          main=src-tauri/gen/android/app/src/main
          install -Dm644 docs/android/network_security_config.xml "$main/res/xml/network_security_config.xml"
          sed -i 's/<application$/<application android:networkSecurityConfig="@xml\/network_security_config"/' "$main/AndroidManifest.xml"
          pnpm tauri android build --apk --debug --target aarch64
      - run: |
          apk=$(find app/src-tauri/gen/android -path '*/outputs/apk/*' -name '*.apk' | head -1)
          cp "$apk" MutinyMedia-android-no-games.apk
          gh release create android-windows-ui-no-games MutinyMedia-android-no-games.apk --target "$GITHUB_SHA" --prerelease --title 'Mutiny Media Android — Windows UI without Games' --notes 'ARM64 development build using the original customized Windows frontend and upstream Android runtime. Device testing pending.'
        env:
          GH_TOKEN: ${{ github.token }}
