name: Publish Android APK
on:
  push:
    branches: [android-release-artifacts]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat apk.part-* > MutinyMedia-android-engines.apk
          sha256sum -c SHA256SUMS
          gh release create android-v1.0.1-engines MutinyMedia-android-engines.apk MutinyMedia-android-engines-source.zip SHA256SUMS --target "$GITHUB_SHA" --prerelease --title "Mutiny Media for Android 1.0.1" --notes "Development-signed Android preview with libVLC and libtorrent. On-device playback and live integrations remain unverified."
