name: Publish corrected Linux DEB immediately

on:
  push:
    branches: [master]
    paths: [.github/workflows/publish-linux-deb-now.yml]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Retrieve verified native Linux DEB
        uses: actions/download-artifact@v4
        with:
          repository: HornyforCheese/Myrepo
          run-id: 43867414273
          name: mutiny-media-1.0.1-linux-x64-deb
          github-token: ${{ github.token }}
          path: staging

      - name: Check corrected installer and normalise filename
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(staging/*.deb)
          test "${#pkgs[@]}" -eq 1
          pkg="${pkgs[0]}"
          dpkg-deb --field "$pkg" Package Version Architecture
          dpkg-deb --fsys-tarfile "$pkg" | tar -tf - > /tmp/mutiny-pkg-contents.txt
          if grep -E '^\./usr/bin/(ffprobe|ffmpeg|yt-dlp)$' /tmp/mutiny-pkg-contents.txt; then
            echo "Refusing package containing Ubuntu system multimedia binaries" >&2
            exit 1
          fi
          mv "$pkg" staging/MutinyMedia-1.0.1-linux-amd64.deb
          (cd staging && sha256sum MutinyMedia-1.0.1-linux-amd64.deb > SHA256SUMS.txt)

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: HornyforCheese/Myrepo
        run: |
          set -euo pipefail
          cat > /tmp/notes.md <<'ENDNOTES'
          Mutiny Media 1.0.1 for Linux (AMD64), corrected Ubuntu installer.

          This build avoids overwriting Ubuntu's system FFmpeg/ffprobe executables.
          Requires system packages for FFmpeg/yt-dlp and WebKitGTK, installed by apt.

          Install:
          sudo apt install ./MutinyMedia-1.0.1-linux-amd64.deb

          Successful Linux DEB packaging and conflict checks:
          https://github.com/HornyforCheese/Myrepo/actions/runs/43867414273

          Testing release. Runtime UI and streaming need validation on Vultr.
          ENDNOTES
          tag="linux-v1.0.1-deb-fixed"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" staging/MutinyMedia-1.0.1-linux-amd64.deb staging/SHA256SUMS.txt --clobber
            gh release edit "$tag" --draft=false --notes-file /tmp/notes.md
          else
            gh release create "$tag" staging/MutinyMedia-1.0.1-linux-amd64.deb staging/SHA256SUMS.txt --target 80b8a566700125e3716cb929ba1378287c6d5b1b --title 'Mutiny Media 1.0.1 Linux AMD64 - corrected DEB' --notes-file /tmp/notes.md --prerelease
          fi
          gh release view "$tag" --json assets --jq '.assets[].url'
