name: Publish corrected Mutiny Media Linux installer

on:
  workflow_run:
    workflows:
      - Build Mutiny Media 1.0.1 for Linux
    types:
      - completed
    branches:
      - mutiny-media-linux

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == 'HornyforCheese/Myrepo' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download successful Linux DEB artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: HornyforCheese/Myrepo
          run-id: ${{ github.event.workflow_run.id }}
          name: mutiny-media-1.0.1-linux-x64-deb
          path: linux-installer

      - name: Check corrected package and checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(linux-installer/*.deb)
          test "${#files[@]}" -eq 1
          original="${files[0]}"
          dpkg-deb --field "$original" Package Version Architecture
          if dpkg-deb --fsys-tarfile "$original" | tar -tf - | grep -E '^\\./usr/bin/(ffmpeg|ffprobe|yt-dlp)$'; then
            echo "Refusing release: still tries to own system multimedia binaries" >&2
            exit 1
          fi
          mv "$original" linux-installer/MutinyMedia-1.0.1-linux-amd64.deb
          (cd linux-installer && sha256sum MutinyMedia-1.0.1-linux-amd64.deb > SHA256SUMS.txt)

      - name: Publish public corrected DEB
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: HornyforCheese/Myrepo
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          TAG=linux-v1.0.1-deb-fixed
          cat >/tmp/notes.md <<'NOTES'
          Native Linux x64 Mutiny Media 1.0.1 test build. Corrected Ubuntu package installation conflict by using the upstream Linux system-FFmpeg configuration. This DEB no longer installs ffmpeg, ffprobe, or yt-dlp into /usr/bin.

          Requires system FFmpeg, yt-dlp and WebKitGTK dependencies. The package was built and its Ubuntu 24.04 installation requirements checked in CI; playback and app UI remain to be tested on Vultr.

          Install: sudo apt install ./MutinyMedia-1.0.1-linux-amd64.deb
          NOTES
          printf '\nBuild source: %s\nBuild run: %s\n' "$SOURCE_COMMIT" "$SOURCE_RUN" >>/tmp/notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" linux-installer/MutinyMedia-1.0.1-linux-amd64.deb linux-installer/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file /tmp/notes.md --draft=false
          else
            gh release create "$TAG" linux-installer/MutinyMedia-1.0.1-linux-amd64.deb linux-installer/SHA256SUMS.txt --target "$SOURCE_COMMIT" --title "Mutiny Media 1.0.1 Linux DEB (Ubuntu FFmpeg conflict fixed)" --notes-file /tmp/notes.md --prerelease
          fi
