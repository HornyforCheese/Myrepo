name: Android AI and Accounts APK
on:
  push:
    branches: [android-v1.0.1-engines-development]
    paths:
      - 'android/**'
      - '.github/workflows/android-ai-accounts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify Android UI and account regression tests
        working-directory: android
        run: |
          npm ci
          npm test
      - name: Build debug APK
        working-directory: android
        run: |
          gradle --no-daemon :app:assembleDebug
      - name: Record APK checksum
        run: sha256sum android/app/build/outputs/apk/debug/*.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MutinyMedia-Android-AI-Stremio-Nuvio-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
